name: codexfinal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # المكتبات الأساسية لمشروعك مع إصدارات مستقرة ومتوافقة
  supabase_flutter: ^2.6.0
  printing: ^5.14.3
  path_provider: ^2.1.5
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  pdf_render_maintained: ^1.0.0
  pdf_text_extraction: ^2.1.1
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # إعدادات الخط المحلي المنسقة بشكل برمي صحيح بنسبة 100%
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png" # مسار شعار Code X الخاص بك
  min_sdk_android: 21 # متوافق مع إعدادات قاعدة البيانات والنظام لديك